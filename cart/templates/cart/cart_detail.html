{% extends 'main/base.html' %}
{% load static %}
{% block title %}GameStore | Cart{% endblock %}

{% block content %}
<!-- ========== CART PAGE ========== -->
<div class="cart-page">

  <!-- Page Header -->
  <div class="cart-header">
    <h1 class="cart-title">My Cart</h1>
      <form action="{% url 'cart:clear' %}"
       hx-get="{% url 'cart:clear' %}"
       hx-target="#cart-shell"
      >
          {% if cart|length > 0 %}
        <button class="cart-clear-btn" type="submit">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
          Clear Cart
        </button>
          {% endif %}
      </form>
  </div>

  <!-- Layout -->
  <div class="cart-layout" id="cart-shell">
    {% include 'partial/cart-partial.html' %}
  </div>

  <!-- Toast Notification -->
  <div class="cart-toast" id="cart-toast"></div>

</div>
{% endblock %}
